<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f6f7fa" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta name="color-scheme" content="light dark" />
		<!-- Runs before paint without allowing arbitrary inline scripts in the CSP. -->
		<script src="%sveltekit.assets%/theme.js"></script>
		<!-- Demo only: remove the robots tag when the real site launches. -->
		<meta name="robots" content="noindex" />
		<link rel="icon" type="image/webp" href="%sveltekit.assets%/photos/logo.webp" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
